<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="600" height="800">
  <rect width="600" height="800" fill="#141418"/>
  <defs>
    <linearGradient id="sketchGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff5d0"/>
      <stop offset="100%" stop-color="#d4af37"/>
    </linearGradient>
  </defs>
  <!-- Grid background like designer drafting paper -->
  <g stroke="rgba(255,255,255,0.04)" stroke-width="1">
    <path d="M 0,100 L 600,100 M 0,200 L 600,200 M 0,300 L 600,300 M 0,400 L 600,400 M 0,500 L 600,500 M 0,600 L 600,600 M 0,700 L 600,700"/>
    <path d="M 100,0 L 100,800 M 200,0 L 200,800 M 300,0 L 300,800 M 400,0 L 400,800 M 500,0 L 500,800"/>
  </g>
  
  <!-- Hand-drawn Style Croquis Silhouette -->
  <g transform="translate(300, 80)" stroke="url(#sketchGold)" stroke-width="1.8" fill="none">
    <!-- 9-head proportion guide -->
    <line x1="-120" y1="0" x2="120" y2="0" stroke="rgba(212,175,55,0.3)" stroke-dasharray="4,4"/>
    <line x1="-120" y1="120" x2="120" y2="120" stroke="rgba(212,175,55,0.3)" stroke-dasharray="4,4"/>
    <line x1="-120" y1="220" x2="120" y2="220" stroke="rgba(212,175,55,0.3)" stroke-dasharray="4,4"/>
    <line x1="-120" y1="340" x2="120" y2="340" stroke="rgba(212,175,55,0.3)" stroke-dasharray="4,4"/>
    <line x1="-120" y1="600" x2="120" y2="600" stroke="rgba(212,175,55,0.3)" stroke-dasharray="4,4"/>
    
    <!-- Stylized Croquis Lines -->
    <ellipse cx="0" cy="50" rx="18" ry="24"/>
    <path d="M 0,74 C 0,85 0,95 0,105"/>
    <!-- Shoulders & Waist -->
    <path d="M -60,115 C -30,110 30,110 60,115 L 28,215 C 20,240 35,270 42,300 L -42,300 C -35,270 -20,240 -28,215 Z"/>
    <!-- Elegant Gestural Fashion Curves -->
    <path d="M -40,300 C -60,400 -120,550 -160,610 C -80,630 80,630 160,610 C 120,550 60,400 40,300 Z" fill="rgba(212,175,55,0.06)"/>
    <path d="M -15,300 C -35,420 -80,540 -100,615"/>
    <path d="M 15,300 C 35,420 80,540 100,615"/>
  </g>
  <text x="300" y="740" text-anchor="middle" font-family="'Cinzel', serif" font-size="18" fill="url(#sketchGold)" letter-spacing="3">HAUTE CROQUIS STUDY</text>
  <text x="300" y="765" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#888890" letter-spacing="2">PENCIL &amp; GOLD FOIL • ATELIER ARCHIVE</text>
</svg>