<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="600" height="800">
  <defs>
    <radialGradient id="bgGlow3" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#141724"/>
      <stop offset="100%" stop-color="#08090d"/>
    </radialGradient>
    <linearGradient id="goldText3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff0c2"/>
      <stop offset="50%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#8a6e1d"/>
    </linearGradient>
    <linearGradient id="noirWool" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f2029"/>
      <stop offset="100%" stop-color="#0d0e13"/>
    </linearGradient>
  </defs>
  <rect width="600" height="800" fill="url(#bgGlow3)"/>
  <circle cx="300" cy="380" r="280" fill="none" stroke="rgba(212,175,55,0.15)" stroke-width="1.5"/>
  
  <g transform="translate(300, 100)">
    <!-- Head / Neck -->
    <ellipse cx="0" cy="40" rx="20" ry="26" fill="#141418" stroke="url(#goldText3)" stroke-width="2"/>
    <path d="M -8,66 L 8,66 L 14,92 L -14,92 Z" fill="#141418" stroke="url(#goldText3)" stroke-width="1.5"/>
    <!-- Tailored Blazer Jacket -->
    <path d="M -75,100 L 75,100 L 50,300 L -50,300 Z" fill="url(#noirWool)" stroke="url(#goldText3)" stroke-width="2.5"/>
    <!-- Lapels -->
    <path d="M -20,100 L -40,180 L 0,240 L 40,180 L 20,100" fill="none" stroke="url(#goldText3)" stroke-width="2"/>
    <!-- Gold buttons -->
    <circle cx="0" cy="235" r="4" fill="#d4af37"/>
    <circle cx="0" cy="260" r="4" fill="#d4af37"/>
    <circle cx="0" cy="285" r="4" fill="#d4af37"/>
    <!-- Sleeves -->
    <path d="M -75,100 L -95,280 L -70,285 L -55,160" fill="url(#noirWool)" stroke="url(#goldText3)" stroke-width="2"/>
    <path d="M 75,100 L 95,280 L 70,285 L 55,160" fill="url(#noirWool)" stroke="url(#goldText3)" stroke-width="2"/>
    <!-- Pencil Skirt -->
    <path d="M -42,305 L 42,305 L 35,530 L -35,530 Z" fill="url(#noirWool)" stroke="url(#goldText3)" stroke-width="2.5"/>
  </g>
  <text x="300" y="740" text-anchor="middle" font-family="'Cinzel', serif" font-size="20" fill="url(#goldText3)" letter-spacing="4">SOLARIS MET BLAZER</text>
  <text x="300" y="765" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#a8a7a2" letter-spacing="2">ARCHITECTURAL TAILORING • SS26</text>
</svg>